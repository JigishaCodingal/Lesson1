<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

</head>
<body>
    <!--
    p:padding
    m:margin
    max level:5

    suffix:
    x:sets both left and right
    y:sets both top and bottom

    </div>
    <div class="container py-6 mx-5 bg-success text-white">

        <p>Making kids fall in love with coding</p>
    </div>

<head>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

</head>

<body>
    <!--
    p:padding
    m:margin
    max level:5

    suffix:
    x:sets both left and right
    y:sets both top and bottom
    b:bottom
    l:left
    r:right
    blank:from all sides

    <div class="container border">
        <h1>Codingal</h1>
        <p>Making kids fall in love with coding</p>

    <div class="container pb-5 my-5  bg-success text-white">

    <div class="container p-6 my-3 bg-danger text-white">

        <p>This container has a dark backgound with white text, border and some extra padding and margin</p>
    </div>
